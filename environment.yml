# Main environment: training, evaluation, interpretability, figures, tests.
#   conda env create -f environment.yml && conda activate beta_lncrna
# GPU machine (CUDA 12.1, as used for the reported results): create it as is.
# CPU-only machine (tests, figures): drop the CUDA lines first
#   grep -v -E "nvidia|pytorch-cuda|pytorch-mutex" environment.yml > /tmp/env_cpu.yml
#   conda env create -f /tmp/env_cpu.yml
name: beta_lncrna
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pytorch::pytorch=2.5.1
  - pytorch::pytorch-cuda=12.1
  - pytorch::pytorch-mutex=1.0=cuda
  - numpy=1.26.4
  - pandas=2.3.3
  - scipy=1.15.3
  - scikit-learn=1.6.1
  - biopython=1.85
  - matplotlib=3.10.3
  - pillow=11.3.0
  - tqdm=4.67.0
  - pytest=9.1.1